<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tachkila-v2</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- <script type="module" src="../main.js" defer></script> -->
    <script type="module" src="js/joueurs.js" defer></script>
  </head>
  <body class="bg-blue-500 font-sans grid grid-cols-6 grid-rows-6">
    <header
      class="relative col-[1/7] row-[1/1] bg-[#1a1f33] text-[#e5e7eb] flex flex-row justify-between items-center px-4 py-3 border-b border-[#1a2233]"
    >
      <div class="logo flex flex-row items-center gap-3">
        <img
          src="imgs/logo.jpeg"
          alt="logo"
          class="w-12 h-12 object-cover rounded-full"
        />
        <div>
          <h1 class="font-bold text-xl tracking-wide">TACHKILA</h1>
          <p>codaNova</p>
        </div>
      </div>
      <nav class="bg-[#1d253d00] flex gap-3 items-center">
        <a href="pages/effectifPg.html"
          ><button class="effectif">Effectif</button></a
        >
        <a href="index.html"
          ><button class="composition bg-green-500 p-2 rounded-xl">
            Composition
          </button></a
        >
        <a href="pages/matchsPg.html"><button class="matchs">Matchs</button></a>
      </nav>
      <div class="positions hidden md:flex items-center gap-8">
        <ul class="flex flex-row gap-6 list-disc font-bold">
          <li class="text-[#f59e0b]">GB</li>
          <li class="text-[#3b82f6]">DEF</li>
          <li class="text-[#22c55e]">MIL</li>
          <li class="text-[#ef4444]">ATT</li>
        </ul>
      </div>
    </header>
    <aside
      class="col-[1/3] row-[2/7] bg-[#1a2233] text-white font-bold border-r-1 border-r-[#1a2233] flex flex-col gap-6 w-auto md:grid-row-[2/3] md:gap-1"
    >
      <div id="totalNumPlayers" class="flex justify-between items-center px-2">
        <h3>Effectif</h3>
        <p class="bg-[#0f1625] text-[#9ca3af] px-3 py-2 rounded-xl">
          0 joueur(s)
        </p>
      </div>
      <li class="md:text-sm">
        Clique sur joueur place pour voir sa case sur le terrain. pour modifier,
        pour supprimer.
      </li>
      <div id="playersList" class="flex flex-col gap-2 overflow-auto">
        <div class="border-1 p-5 text-center">
          <p>Aucun joueur pour le moment.</p>
        </div>
      </div>
    </aside>
    <main
      class="col-[3/7] row-[2/7] bg-[#151d2e] md:grid-row-[4/8] flex flex-col gap-4"
    >
      <div class="bg-whit-500" id="terrain">
        <div
          class="flex justify-center items-center"
          id="GB-Gardien"
          data.active="false"
          ;
        >
          <span class="bg-yellow-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="DG-Defenseurgauche"
          data.active="false"
        >
          <span class="bg-blue-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="DC-Defenseurcentral1"
          data.active="false"
        >
          <span class="bg-blue-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="DC-Defenseurcentral2"
          data.active="false"
        >
          <span class="bg-blue-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="DD-Defenseurdroit"
          data.active="false"
        >
          <span class="bg-blue-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="MG-Milieugauche"
          data.active="false"
        >
          <span class="bg-green-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="MC-Miliuecentral1"
          data.active="false"
        >
          <span class="bg-green-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="MC-Miliuecentral2"
          data.active="false"
        >
          <span class="bg-green-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="MD-Miliuedroit"
          data.active="false"
        >
          <span class="bg-green-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="BU-Buteur1"
          data.active="false"
        >
          <span class="bg-red-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
        <div
          class="flex justify-center items-center"
          id="BU-Buteur2"
          data.active="false"
        >
          <span class="bg-red-500 p-2 w-10 h-10 rounded-full flex"></span>
        </div>
      </div>
      <p id="numberOfPlayerInThefield" class="text-white text-xl">
        the totla number of the player is 0
      </p>
    </main>
  </body>
</html>
