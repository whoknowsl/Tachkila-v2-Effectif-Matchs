<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tachkila-v2</title>
    <link rel="stylesheet" href="/dist/output.css" />
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="/js/matches.js" type="module"></script>
  </head>
  <body class="bg-[#1a1f33]">
    <header
      class="relative col-[1/7] row-[1/1] bg-[#1a1f33] text-[#e5e7eb] flex flex-row justify-between items-center px-4 py-3 border-b border-[#1a2233]"
    >
      <div class="logo flex flex-row items-center gap-3">
        <img
          src="/imgs/logo.jpeg"
          alt="logo"
          class="w-12 h-12 object-cover rounded-full"
        />
        <div>
          <h1 class="font-bold text-xl tracking-wide">TACHKILA</h1>
          <p>codaNova</p>
        </div>
      </div>

      <nav class="bg-[#1d253d00] flex gap-3 items-center">
        <a href="effectifPg.html"><button class="effectif">Effectif</button></a>
        <a href="/index.html"
          ><button class="composition">Composition</button></a
        >
        <a href="matchsPg.html"
          ><button class="matchs bg-green-500 p-2 rounded-xl">Matchs</button></a
        >
      </nav>
      <div class="positions hidden md:flex items-center gap-8">
        <ul class="flex flex-row gap-6 list-disc font-bold">
          <li class="text-[#f59e0b]">GB</li>
          <li class="text-[#3b82f6]">DEF</li>
          <li class="text-[#22c55e]">MIL</li>
          <li class="text-[#ef4444]">ATT</li>
        </ul>
      </div>
    </header>
    <section class="">
      <div class="flex justify-between px-1 items-center">
        <div class="text-white">
          <h1 class="">Matchs</h1>
          <p>Calendrier et resaultats de la saison 2026/2027</p>
        </div>
        <button
          class="bg-[#22c55e] px-5 py-5 self-center my-3 rounded-xl text-xl md:px-3 text-white"
          id="PopUpFormBtn"
        >
          + Ajouter un match
        </button>
      </div>
      <div class="search-bar bg-[#1a2438] py-5 px-3 grid grid-cols-4 gap-3">
        <input
          class="bg-[#0b1426] text-[#64748b] py-3 px-3 px-1 col-start-1 col-end-4 rounded-xl"
          type="text"
          name="searchInput"
          id="search-input"
          placeholder="Rechercher un joueur par nom ..."
        />
        <div
          class="text-white bg-[#0b1426] flex justify-evenly rounded-xl"
        >
          <button class="">Tous 3</button>
          <button class="">A venir 1</button>
          <button class="">Joues 2</button>
        </div>
      </div>
      <div class="matches-lists flex flex-col px-5 py-4"></div>
    </section>
     <form
      class="hidden bg-[#1a2233] text-white fixed top-1/2 left-1/2 -translate-y-1/2 -translate-x-1/2 z-50 w-full max-w-[560px] p-5 rounded-xl flex flex-col gap-4 grid-rows-6"
      action=""
      id="newMatchForm"
    >
      <div class="flex justify-between items-center">
        <h3 class="text-2xl">Ajouter un joueur</h3>
        <span class="text-2xl"
          ><i id="removePopUpForm" class="fa-solid fa-xmark"></i
        ></span>
      </div>
       <div class="grid grid-cols-2 grid-rows-3 gap-3">
        <div class="flex gap-1 flex-col col-span-2">
          <label for="oppenant-name">Adversaire</label>
        <input
          id = "oppenant-name"
          class="bg-[#0f1625] p-3 rounded-xl focus:outline-4 focus:outline-green-500"
          type="text"
        /><p class="errors p-2 text-red-500" id="errorName"></p>
      </div>
        <div class="flex flex-col gap-1">
         <label for="date-of-matche">Date</label>
        <input
          id="date-of-matche"
          class="bg-[#0f1625] p-3 rounded-xl focus:outline-4 focus:outline-green-500"
          type="date"
        />
        <p class="errors p-2 text-red-500 focus:outline-green-500" id="errorNumber"></p>
      </div>
        <div class="flex flex-col gap-1">
         <label for="match-time">Heure</label>
        <input
          id="match-time"
          class="bg-[#0f1625] p-3 rounded-xl focus:outline-4 focus:outline-green-500"
          type="time"
        />
        <p class="errors p-2 text-red-500 focus:outline-green-500" id="errorNumber"></p>
      </div>  
        <div class="flex gap-1 flex-col col-span-2"><label for="location">Lieu</label>
        <input
          id="location"
          class="bg-[#0f1625] p-3 rounded-xl focus:outline-4 focus:outline-green-500"
          type="text"
        /><p class="errors p-2 text-red-500" id="errorName"></p>
      </div>
        <div class="flex flex-col gap-5 col-span-2">
          <p for="">Lieu du match</p>
          <div id="" class="grid grid-cols-2 gap-3">
            <label  class = "bg-[#0f1625] p-3 rounded-xl has-checked:bg-green-500"  for="exterieur"><input id="exterieur" name="lieu" type="radio" value="exterieur"> Exterieur</label>
            <label class = "bg-[#0f1625] p-3 rounded-xl has-checked:bg-green-500" for="domicile"><input id="domicile" name="lieu" type="radio" value="domicile"> Domicile</label>
          </div>
        </div>
      </div>
    </div>
      <div class="flex gap-3 justify-end">
        <button
          id="annuleBtn"
          class="bg-[#0f1625] p-3 rounded-2xl"
          type="button"
        >
          Annuler
        </button>
        <button
          id="submitBtn"
          class="bg-[#22c55e] p-3 rounded-2xl hover:not-focus:bg-green-700"
        >
          Ajouter
        </button>
      </div>
      <p
        class="errors p-2 text-red-500 text-center text-xl"
        id="formNoValidMesg"
      ></p>
      <p
        class="p-2 bg-green-200/50 text-green-500 text-center text-xl hidden"
        id="formValidMsg"
      >
        Succsse
      </p>
    </form>
    <form class="hidden bg-[#1a2233] text-white fixed top-1/2 left-1/2 -translate-y-1/2 -translate-x-1/2 z-50  p-5 rounded-xl flex flex-col gap-2" id="scorePopUp">
      <div class="flex justify-between">
      <h1>Enter Score</h1>
       <span class="text-2xl"
          ><i id="remove-pop-up-score" class="fa-solid fa-xmark"></i
        ></span>
      </div>
      <div class=" items-center flex gap-4">
      <input class="bg-[#0f1625] p-3 rounded-xl focus:outline-4 focus:outline-green-500" type="number" id="left" placeholder="left">
      <input class="bg-[#0f1625] p-3 rounded-xl focus:outline-4 focus:outline-green-500" type="number" id="right" placeholder="right">
      <input class="bg-[#22c55e] px-5 py-5 self-center my-3 rounded-xl text-xl md:px-3 text-white" type="submit" id="submit-score" value="Enter">
    </div>
  </form>
  </body>
</html>
